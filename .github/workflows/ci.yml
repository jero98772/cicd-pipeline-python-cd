name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: cicd-local:${{ github.sha }}
      DOCKER_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/entrega-2-cicd
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Black
        run: black --check .

      - name: Flake8
        run: flake8 .

      - name: Pruebas unitarias y de componente (cobertura >= 80%)
        run: >
          pytest tests/unit tests/component
          --cov=app --cov-report=xml --cov-report=term-missing
          --cov-fail-under=80

      - name: SonarCloud y Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Construir imagen
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Levantar contenedor
        run: |
          docker run -d --name app-test -p 5000:5000 "$LOCAL_IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs app-test
          exit 1

      - name: Pruebas de aceptacion contra el contenedor
        run: pytest tests/acceptance
        env:
          BASE_URL: http://localhost:5000

      - name: Logs del contenedor si falla
        if: failure()
        run: docker logs app-test || true

      - name: Login en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar la MISMA imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$LOCAL_IMAGE" "$DOCKER_REPO:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$DOCKER_REPO:latest"
          docker push "$DOCKER_REPO:${{ github.sha }}"
          docker push "$DOCKER_REPO:latest"
